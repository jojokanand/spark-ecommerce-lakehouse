name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and Sample Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SPARK_LOCAL_IP: 127.0.0.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.9.18"
          python-version: "3.12.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12.11

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Validate lockfile
        run: uv lock --check

      - name: Lint
        run: uv run ruff check phases scripts

      - name: Compile Python sources
        run: uv run python -m compileall -q phases scripts

      - name: Build and validate sample lakehouse
        run: uv run python scripts/run_sample_pipeline.py
