[project]
name = "spark-ecommerce-lakehouse"
version = "0.1.0"
description = "A reproducible PySpark ecommerce pipeline for learning medallion architecture, performance, streaming, testing, and ML feature engineering."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faker==40.28.1",
    "pyspark==4.1.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # import ordering
    "B",   # flake8-bugbear
    "UP",  # Python syntax modernization
    "DTZ", # timezone-aware datetime usage
]
ignore = [
    "E501", # formatting handles line length
]